[build]
  publish = "dist"
  command = "npm ci && npm test && npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_BASE (backend URL) in the Netlify UI → Site settings → Environment variables

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
