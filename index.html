<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#09070F" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="HayalKız — AI companions in Telegram" />
    <!-- Prevent caching in Telegram Mini App -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>HayalKız</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* First paint before the bundle loads: same background as the app, no flash */
      html, body {
        margin: 0;
        padding: 0;
        background: #09070F;
        color: #F4EEF6;
        -webkit-font-smoothing: antialiased;
      }
      .boot {
        display: grid;
        place-items: center;
        min-height: 100vh;
        font: italic 500 30px/1 'Cormorant Garamond', Georgia, serif;
        color: rgba(244, 238, 246, 0.5);
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">HayalKız</div>
    </div>
    <script>
      try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.ready() } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
