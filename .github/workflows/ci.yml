name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: No user id fallbacks in the bundle
        run: |
          ! grep -R "test_user" dist/assets/*.js
          ! grep -R "initDataUnsafe?.user?.id ||" src
